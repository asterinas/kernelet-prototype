# Compile the OSDK teaching kernel against vOSTD.

[package]
name = "hello"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "hello"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
ostd = { package = "vostd", path = "../../vostd" }
align_ext.workspace = true

[lints]
workspace = true
