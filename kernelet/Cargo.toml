[workspace]
resolver = "2"
members = ["vostd", "kernels/hello", "kernels/probe", "kernels/yield", "kernels/sched", "kernels/mem", "kernels/pie"]

[workspace.dependencies]
align_ext = "0.1.0"

# The one lint setting of the Asterinas workspace the kernels need: OSTD's
# `#[ostd::main]` expands to code under `cfg(ktest)`, Asterinas's test
# configuration, which no build here sets.
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(ktest)'] }

[profile.release]
panic = "abort"
debug = false
overflow-checks = true
