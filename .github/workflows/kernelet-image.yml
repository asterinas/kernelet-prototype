name: Build Kernelet image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kernelet-image.yml
      - Cargo.toml
      - DOCKER_IMAGE_VERSION
      - rust-toolchain.toml
      - kernelet/tools/docker/**
      - ostd/libs/align_ext/Cargo.toml
      - ostd/libs/ostd-macros/Cargo.toml
      - kernelet/Makefile
      - kernelet/Cargo.lock
      - kernelet/**/Cargo.toml

permissions:
  contents: read

concurrency:
  group: kernelet-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Make space for the base image and guest kernel
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - name: Build the image
        run: |
          version=$(cat DOCKER_IMAGE_VERSION)
          image="asterinas/kernelet:$version"
          docker build --platform linux/amd64 --build-arg BASE_VERSION="$version" \
            --file kernelet/tools/docker/Dockerfile --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Boot and test the teaching kernels
        run: |
          docker run --rm --network none --device /dev/kvm \
            --volume "$GITHUB_WORKSPACE:/workspace" "$IMAGE" make test

      - name: Publish to Docker Hub
        if: github.repository == 'asterinas/kernelet-prototype' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$IMAGE"
