name: check_kernelet_format

on: [pull_request, push]

permissions:
  contents: read

jobs:
  check_kernelet_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install format and lint tools
        run: |
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-18
      - run: make -C kernelet check-format CLANG_FORMAT=clang-format-18
      - run: make -C kernelet clippy
